<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Club Website</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
<style>
body  {
background-color: lightblue;
font-family: Arial, sans-serif;
padding: 30px 15px;
}
h1{
text-align:center;
color:rgb(15, 140, 21);
}
.club-card
{
text-align:center;
border: 2px dashed burlywood;
border-radius:8px;
padding:20px;
margin-bottom:20px;
background-color:red;
}
.club-card h3
{
color:rgb(37, 30, 30);
}
.club-card p
{
color:white;
font-size:16px; 
text-decoration:double;
}
</style>
</head>
<body>
    <h1>My School Clubs</h1>
    <div class="container">
        <div class="row">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="club-card">
                    <h3>Coding Club</h3>
                    <p>I learn how to create websites, games, and simple apps.</p>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <div class="club-card">
                    <h3>Science Club</h3>
                    <p>I enjoy doing different experiments and discovering how things work in the world, in ourself, and
                        also in all of the universe.</p>
                </div>
            </div>

            <div class="col-12 col-md-12 col-lg-4">
                <div class="club-card">
                    <h3>Art Club</h3>
                    <p>I love drawing, painting, and creating colourful designs.</p>
                </div>
            </div>

        </div>
    </div>
</body>

</html>
